name: Core climate and hydrology
on:
  push:
    branches: [main]
    paths:
      - 'src/WorldGen.Core/**'
      - 'testsrc/WorldGen.Tests/L04A/**'
      - 'testsrc/WorldGen.Tests/L04B/**'
      - 'testsrc/WorldGen.Tests/L04C/**'
      - 'testsrc/WorldGen.Tests/L05A/**'
      - 'testsrc/WorldGen.Tests/L05B/**'
      - 'testsrc/WorldGen.Tests/L05C/**'
      - 'testsrc/WorldGen.ClimateHydrology.Tests/**'
      - 'tools/test_climate_hydrology.py'
      - 'tools/test_drainage_scaling.py'
      - 'registry/fixtures.json'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/climate-hydrology.yml'
  pull_request:
    paths:
      - 'src/WorldGen.Core/**'
      - 'testsrc/WorldGen.Tests/L04*/**'
      - 'testsrc/WorldGen.Tests/L05*/**'
      - 'testsrc/WorldGen.ClimateHydrology.Tests/**'
      - 'tools/test_climate_hydrology.py'
      - 'tools/test_drainage_scaling.py'
      - '.github/workflows/climate-hydrology.yml'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: climate-hydrology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  climate:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en-US
      CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove wrong-cell refusal and unchanged valid climate outputs
        shell: pwsh
        run: |
          python tools/test_climate_hydrology.py --configuration $env:CONFIGURATION --disposable-checkout
          if ($LASTEXITCODE -ne 0) { throw 'Climate/hydrology regression failed.' }
      - name: Compare routing and discharge to the pinned pre-optimization source
        shell: pwsh
        run: |
          python tools/test_drainage_scaling.py --configuration $env:CONFIGURATION --disposable-checkout
          if ($LASTEXITCODE -ne 0) { throw 'Drainage equivalence/scaling regression failed.' }
      - name: Retain numerical witnesses, original-test results and maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-hydrology-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            testsrc/WorldGen.ClimateHydrology.Tests/TestResults/
            .local/L04A/maps/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
