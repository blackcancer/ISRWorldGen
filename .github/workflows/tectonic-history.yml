name: Tectonic material history and full-world scale
on:
  push:
    branches: [main]
    paths:
      - 'src/WorldGen.Core/Geology/Evolution/**'
      - 'src/WorldGen.Core/Foundation/**'
      - 'testsrc/WorldGen.TectonicEvolution/**'
      - 'tools/export_tectonic_history.py'
      - 'tools/verify_tectonic_platforms.py'
      - 'tools/export_spatial_png.py'
      - '.github/workflows/tectonic-history.yml'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tectonic-material-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        scheme: [donor, coupled]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile real Core, run causal checks and evolve three entire atlases
        shell: pwsh
        run: |
          dotnet run --project testsrc/WorldGen.TectonicEvolution/WorldGen.TectonicEvolution.csproj -c Release -- .local/tectonic-history 512 ${{ matrix.scheme }}
          if ($LASTEXITCODE -ne 0) { throw 'Tectonic state computation or its invariants failed.' }
      - name: Verify exact heights and export unmasked PNG16
        shell: pwsh
        run: |
          python tools/export_tectonic_history.py --root .local/tectonic-history
          if ($LASTEXITCODE -ne 0) { throw 'Heightmap encoding failed.' }
      - name: Retain exact candidate source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .local/tectonic-history/source -Force | Out-Null
          git archive --format=zip --output=.local/tectonic-history/source/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source snapshot failed.' }
      - name: Publish material fields, histories and PNGs (never a geographic PASS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tectonic-history-${{ matrix.os }}-${{ matrix.scheme }}-${{ github.sha }}
          path: .local/tectonic-history/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  platforms:
    needs: history
    strategy:
      matrix:
        scheme: [donor, coupled]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: tectonic-history-ubuntu-latest-${{ matrix.scheme }}-${{ github.sha }}
          path: .local/linux
      - uses: actions/download-artifact@v4
        with:
          name: tectonic-history-windows-latest-${{ matrix.scheme }}-${{ github.sha }}
          path: .local/windows
      - name: Compare the actual heights, material fields and PNG16 across platforms
        run: python tools/verify_tectonic_platforms.py .local/linux .local/windows .local/platforms.json
      - uses: actions/upload-artifact@v4
        with:
          name: tectonic-platform-comparison-${{ matrix.scheme }}-${{ github.sha }}
          path: .local/platforms.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
