name: Reproducible Core development environment
on:
  push:
    branches: ['codex/terrain-transport-20260924']
    paths: ['.github/workflows/terrain-development.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - name: Build the unchanged Core and archive only public compiler components
        shell: bash
        run: |
          set -euo pipefail
          mkdir .local
          dotnet build src/WorldGen.Core/WorldGen.Core.csproj -c Release > .local/build.log
          dotnet --info > .local/runtime.txt
          sdk=$(dotnet --version)
          tar -C "$DOTNET_ROOT" -czf .local/compiler.tar.gz dotnet host shared/Microsoft.NETCore.App packs/Microsoft.NETCore.App.Ref packs/Microsoft.NETCore.App.Host.linux-x64 "sdk/$sdk" LICENSE.txt ThirdPartyNotices.txt
          git archive --format=zip --output=.local/source.zip HEAD
          sha256sum .local/compiler.tar.gz .local/source.zip > .local/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-development-${{ github.sha }}
          path: .local/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error
