name: Continuous solid-relief export checks
on:
  push:
    branches: [main, 'codex/relief-continu-*']
    paths:
      - 'tools/export_relief_continu.py'
      - 'tools/relief_continu_viewer.html'
      - 'tools/export_spatial_png.py'
      - 'tests/relief-continu/**'
      - '.github/workflows/relief-continu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relief-continu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pillow==12.0.0
      - name: Numeric, source-integrity and interruption checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .local/rcv-tests -Force | Out-Null
          python tests/relief-continu/test_relief_continu.py 2>&1 | Tee-Object .local/rcv-tests/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'RCV tests failed' }
          python -m pip freeze | Out-File .local/rcv-tests/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcv-tests-${{ matrix.os }}-${{ github.sha }}
          path: .local/rcv-tests
          include-hidden-files: true
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pillow==12.0.0 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Real browser overlays, exact values and downloads
        run: python tests/relief-continu/browser_checks.py .local/rcv-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcv-browser-${{ github.sha }}
          path: .local/rcv-browser
          include-hidden-files: true
          retention-days: 30
