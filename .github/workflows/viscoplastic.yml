name: Viscoplastic stress threshold and paired true heights
on:
  push:
    branches: ['codex/viscoplastic-*']
    paths: ['src/WorldGen.Core/Geology/Evolution/**', 'testsrc/WorldGen.Viscoplastic/**', 'tools/verify_viscoplastic.py', '.github/workflows/viscoplastic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - name: Build actual Core and run new and retained suites
        shell: pwsh
        run: |
          New-Item -ItemType Directory .local | Out-Null
          foreach ($name in @('Viscoplastic','StrainWeakening','MaterialStrain','RiftNecking','RiftSpreadingIntegration','RiftRegression')) {
            dotnet build "testsrc/WorldGen.$name/WorldGen.$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --no-build --project "testsrc/WorldGen.$name/WorldGen.$name.csproj" -c Release 1> ".local/$name.json" 2> ".local/$name.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plastic-checks-${{ matrix.os }}-${{ github.sha }}
          path: .local/
          include-hidden-files: true
          retention-days: 30
  worlds:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        seed: [-437287116, 20260906, 73]
        mode: [control, plastic]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Execute entire million-unit material history
        shell: pwsh
        run: |
          New-Item -ItemType Directory .local | Out-Null
          dotnet run --project testsrc/WorldGen.Viscoplastic/WorldGen.Viscoplastic.csproj -c Release -- .local/world ${{ matrix.seed }} ${{ matrix.mode }} 2>&1 | Tee-Object .local/run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python tools/export_strain_weakening.py .local/world
      - name: Verify exact expected reuse refusal and byte preservation
        shell: pwsh
        run: |
          $before = (Get-ChildItem .local/world -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256).Hash -join ','
          dotnet run --no-build --project testsrc/WorldGen.Viscoplastic/WorldGen.Viscoplastic.csproj -c Release -- .local/world ${{ matrix.seed }} ${{ matrix.mode }} 2>&1 | Out-File .local/reuse.log
          $code = $LASTEXITCODE
          $after = (Get-ChildItem .local/world -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256).Hash -join ','
          if ($code -eq 0 -or $before -ne $after -or (Get-Content .local/reuse.log -Raw) -notmatch 'Never overwrite prior evidence') { throw 'Missing expected safe refusal' }
          @{preserved=$true;nativeExit=$code} | ConvertTo-Json | Set-Content .local/reuse.json
          exit 0
      - name: Preserve source and runtime even when rejected
        if: always()
        shell: pwsh
        run: |
          git archive --format=zip --output=.local/source.zip HEAD
          dotnet --info | Set-Content .local/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plastic-world-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.seed }}-${{ github.sha }}
          path: .local/
          include-hidden-files: true
          retention-days: 30
  compare:
    needs: worlds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          pattern: plastic-world-*-${{ github.sha }}
          path: .local/downloads
      - run: python tools/verify_viscoplastic.py .local/downloads .local/platforms.json
      - uses: actions/upload-artifact@v4
        with:
          name: plastic-platforms-${{ github.sha }}
          path: .local/platforms.json
          retention-days: 30
